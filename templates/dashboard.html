<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dante Dashboard — Mezie</title>
<style>
/* ═══ OKLCH COLOR SYSTEM ═══ */
:root {
  --clr-health: oklch(72% 0.19 145);
  --clr-spiritual: oklch(75% 0.15 80);
  --clr-trading: oklch(65% 0.18 255);
  --clr-creed: oklch(65% 0.2 300);
  --clr-volatile: oklch(68% 0.2 30);
  --clr-networking: oklch(72% 0.16 160);
  --clr-avatar: oklch(70% 0.18 280);
  --clr-product: oklch(70% 0.15 50);
  --clr-admin: oklch(60% 0.12 300);
  --clr-planning: oklch(60% 0.08 260);
  --clr-tradingbot: oklch(65% 0.18 255);
  --clr-meals: oklch(55% 0.02 260);
  --clr-free: oklch(40% 0.01 260);
  --bg: #0b0b12;
  --surface: #141420;
  --surface2: #1a1a2a;
  --border: #1e1e30;
  --text: #d0d0d8;
  --text-dim: #888;
  --text-muted: #555;
  --accent: #af19ff;
  --accent2: #ff4081;
  --radius: 10px;
  --radius-sm: 6px;
}

/* ═══ RESET ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}

/* ═══ HEADER ═══ */
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:100;
}
.header-left{display:flex;align-items:center;gap:12px}
.logo{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;
}
.header-title{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.header-sub{font-size:11px;color:var(--text-dim);margin-top:-2px}
.header-right{display:flex;align-items:center;gap:16px}
.clock{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums}
.view-toggle{display:flex;gap:2px;background:var(--surface2);border-radius:6px;padding:2px}
.view-btn{
  padding:6px 14px;border:none;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--text-dim);background:transparent;
  transition:all 0.15s;
}
.view-btn.active{background:var(--accent);color:#fff}
.view-btn:hover:not(.active){color:var(--text)}

/* ═══ STATS ROW ═══ */
.stats-row{
  display:flex;gap:16px;padding:16px 24px;
  overflow-x:auto;flex-wrap:wrap;align-items:center;
}
.stat-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);padding:10px 16px;
  border-radius:var(--radius);border:1px solid var(--border);
}
.stat-ring{position:relative;width:48px;height:48px;flex-shrink:0}
.stat-ring svg{transform:rotate(-90deg);width:48px;height:48px}
.ring-track{fill:none;stroke:var(--surface2);stroke-width:3.5}
.ring-fill{fill:none;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset 0.5s}
.ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;
}
.stat-info{font-size:11px;color:var(--text-dim)}
.stat-info strong{display:block;font-size:15px;color:var(--text)}
.streak{display:flex;align-items:center;gap:6px;font-size:14px;color:#FFBB28}
.streak-icon{font-size:18px}

/* ═══ VENTURE BARS ═══ */
.venture-strip{display:flex;gap:8px;padding:0 24px 12px;flex-wrap:wrap}
.vcard{
  background:var(--surface);padding:8px 12px;border-radius:var(--radius-sm);
  cursor:pointer;min-width:90px;transition:all 0.15s;
  border:1px solid var(--border);
}
.vcard:hover{border-color:var(--accent)40}
.vcard.active{border-color:var(--accent);background:#1a1030}
.vlabel{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.vbar{height:3px;background:var(--surface2);border-radius:2px;margin:4px 0;overflow:hidden}
.vfill{height:100%;border-radius:2px;transition:width 0.3s}
.vstat{font-size:12px;font-weight:600}

/* ═══ DAY NAV ═══ */
.day-strip{display:flex;gap:4px;padding:0 24px 12px;overflow-x:auto}
.day-btn{
  flex:1;min-width:70px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 6px;cursor:pointer;color:var(--text-dim);
  text-align:center;transition:all 0.15s;font-size:11px;
}
.day-btn:hover{border-color:var(--accent);color:var(--text)}
.day-btn.active{background:#1a1030;border-color:var(--accent);color:#e0e0e0}
.day-label{display:block;font-size:10px;color:var(--text-muted)}
.day-num{display:block;font-size:18px;font-weight:600}
.day-progress{font-size:9px;color:var(--text-muted);display:block;margin-top:2px}

/* ═══ 7-DAY COLUMNS ═══ */
.columns{
  display:grid;grid-template-columns:repeat(7,1fr);gap:8px;
  padding:0 24px 24px;min-height:60vh;
}
.day-col{
  background:var(--surface);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;
}
.day-col.today{border-color:var(--accent)60;box-shadow:0 0 20px var(--accent)10}
.col-header{
  padding:10px 12px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.col-day{font-size:11px;color:var(--text-dim);font-weight:600}
.col-date{font-size:16px;font-weight:700}
.col-focus{font-size:9px;color:var(--text-muted);padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-tasks{padding:8px 0;max-height:calc(100vh - 320px);overflow-y:auto}
.col-tasks::-webkit-scrollbar{width:4px}
.col-tasks::-webkit-scrollbar-track{background:transparent}
.col-tasks::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ═══ NOW INDICATOR ═══ */
.now-bar{
  display:flex;align-items:center;gap:8px;padding:4px 12px;
  color:var(--clr-trading);font-size:10px;font-weight:600;
}
.now-dot{width:8px;height:8px;border-radius:50%;background:var(--clr-trading);animation:pulse 2s infinite}
.now-line{flex:1;height:1px;background:var(--clr-trading)30}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ═══ TASK CARD ═══ */
.task-card{
  padding:8px 12px;border-bottom:1px solid var(--border);
  transition:all 0.2s;position:relative;
}
.task-card:last-child{border-bottom:none}
.task-card:hover{background:var(--surface2)}
.task-card.completed{opacity:0.5}
.task-card.completed .task-title{text-decoration:line-through}
.task-card.skipped{opacity:0.3}
.task-card.carried_over{opacity:0.4;border-left:2px solid #FFBB28}
.task-card.started{background:oklch(55% 0.02 260 / 0.15)}
.task-time{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
.task-dur{color:var(--text-muted);margin-left:4px;font-weight:400}
.task-body{display:flex;align-items:flex-start;gap:6px}
.task-cat{
  font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;
  white-space:nowrap;letter-spacing:0.3px;flex-shrink:0;margin-top:1px;
}
.task-title{font-size:11px;line-height:1.3;flex:1}
.task-details{font-size:9px;color:var(--text-muted);margin-top:2px}
.task-actions{display:flex;gap:3px;margin-top:4px}
.act-btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-dim);padding:2px 8px;border-radius:4px;
  cursor:pointer;font-size:11px;transition:all 0.12s;
}
.act-btn:hover:not(:disabled){background:#2a2a40;color:#fff}
.act-btn:disabled{opacity:0.3;cursor:not-allowed}
.act-btn.start:hover:not(:disabled){border-color:var(--clr-trading);color:var(--clr-trading)}
.act-btn.complete:hover:not(:disabled){border-color:var(--clr-health);color:var(--clr-health)}
.act-btn.skip:hover:not(:disabled){border-color:var(--text-muted);color:var(--text-dim)}
.act-btn.carry:hover:not(:disabled){border-color:#FFBB28;color:#FFBB28}
.act-btn.reset{color:#e04040}
.act-btn.reset:hover:not(:disabled){border-color:#e04040;color:#ff6060;background:#1a1010}
.act-btn.notes{color:var(--text-muted)}
.act-btn.notes:hover:not(:disabled){border-color:var(--text-dim);color:var(--text-dim)}
/* ── Elapsed timer ── */
.elapsed{margin-left:6px;font-size:10px;color:var(--clr-trading);font-family:monospace;animation:pulse 2s infinite;vertical-align:middle}
/* ── Notes textarea ── */
.task-notes{margin-top:4px}
.task-notes textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:6px 8px;font-size:10px;color:var(--text);
  font-family:inherit;resize:none;outline:none;
}
.task-notes textarea:focus{border-color:var(--clr-trading)}

/* ═══ DOD PANEL ═══ */
.dod-toggle{
  position:fixed;right:0;top:50%;transform:translateY(-50%);
  background:var(--surface);border:1px solid var(--border);
  border-right:none;border-radius:var(--radius) 0 0 var(--radius);
  padding:12px 8px;cursor:pointer;z-index:50;
  writing-mode:vertical-lr;font-size:10px;color:var(--text-dim);
  letter-spacing:1px;transition:all 0.2s;
}
.dod-toggle:hover{background:var(--surface2);color:var(--text)}
.dod-panel{
  position:fixed;right:-380px;top:0;bottom:0;width:360px;
  background:var(--surface);border-left:1px solid var(--border);
  z-index:200;transition:right 0.3s;overflow-y:auto;
}
.dod-panel.open{right:0}
.dod-overlay{position:fixed;inset:0;background:#0006;z-index:199;display:none}
.dod-overlay.show{display:block}
.dod-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.dod-header h3{font-size:14px;font-weight:600}
.dod-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer}
.dod-body{padding:12px 20px}
.dod-group{margin-bottom:16px}
.dod-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px}
.dod-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.dod-checkbox{width:16px;height:16px;border:1px solid var(--border);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px}
.dod-checkbox.checked{background:var(--clr-health);border-color:var(--clr-health);color:#fff}

/* ═══ TOAST ═══ */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface2);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;animation:slideIn 0.3s,slideOut 0.3s 1.2s forwards;max-width:300px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1200px){.columns{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.columns{grid-template-columns:1fr};.venture-strip{flex-wrap:nowrap;overflow-x:auto}}

/* ═══ CARRYOVER QUEUE ═══ */
.carry-section{margin:0 24px 24px;display:none}
.carry-section.visible{display:block}
.carry-header{font-size:12px;color:var(--text-dim);margin-bottom:8px;font-weight:600}
.carry-list{display:flex;flex-wrap:wrap;gap:8px}
.carry-item{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-left:2px solid #FFBB28;
  border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;
}
.carry-title{color:var(--text);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carry-cat{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600}
.carry-assign{
  background:var(--surface2);border:1px solid var(--border);border-radius:4px;
  color:var(--text-dim);font-size:10px;padding:2px 8px;cursor:pointer;
}
.carry-assign:hover{background:#2a2a40;color:#fff}
.carry-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0 4px}
.carry-remove:hover{color:#e04040}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="header">
  <div class="header-left">
    <div class="logo">D</div>
    <div>
      <div class="header-title">Dante Dashboard</div>
      <div class="header-sub" id="weekLabel">Loading...</div>
    </div>
  </div>
  <div class="header-right">
    <div class="view-toggle">
      <button class="view-btn active" data-view="week" onclick="setView('week')">Week</button>
      <button class="view-btn" data-view="day" onclick="setView('day')">Day</button>
    </div>
    <div class="clock" id="clock">00:00</div>
  </div>
</div>

<!-- ═══ STATS ═══ -->
<div class="stats-row" id="statsRow"></div>

<!-- ═══ VENTURE BARS ═══ -->
<div class="venture-strip" id="ventureStrip"></div>

<!-- ═══ DAY NAV ═══ -->
<div class="day-strip" id="dayStrip"></div>

<!-- ═══ 7-DAY COLUMNS ═══ -->
<div class="columns" id="columns"></div>

<!-- ═══ CARRYOVER QUEUE ═══ -->
<div class="carry-section" id="carrySection">
  <div class="carry-header">📋 Carryover Queue</div>
  <div class="carry-list" id="carryList"></div>
</div>

<!-- ═══ DOD TOGGLE ═══ -->
<div class="dod-toggle" onclick="toggleDod()">D E F I N I T I O N S</div>
<div class="dod-overlay" id="dodOverlay" onclick="toggleDod()"></div>
<div class="dod-panel" id="dodPanel">
  <div class="dod-header">
    <h3>Definitions of Done</h3>
    <button class="dod-close" onclick="toggleDod()">×</button>
  </div>
  <div class="dod-body" id="dodBody"></div>
</div>

<!-- ═══ TOASTS ═══ -->
<div class="toast-container" id="toasts"></div>

<script>
/* ═══ STATE ═══ */
const LS_KEY = 'dante_dashboard_v4';
const API = '/api';

let state = {
  tasks: [],
  calendar: [],
  streak: 0,
  view: 'week',
  selectedDay: null,
  filterVenture: null,
  dodState: {},
  carryoverQueue: [],
  timers: {}  // taskId → startedAt timestamp
};

/* ═══ CATEGORY CONFIG ═══ */
const CATEGORIES = {
  health: { label: 'Health', color: 'var(--clr-health)', bg: 'oklch(72% 0.19 145 / 0.12)' },
  spiritual: { label: 'Spiritual', color: 'var(--clr-spiritual)', bg: 'oklch(75% 0.15 80 / 0.12)' },
  trading: { label: 'Trading', color: 'var(--clr-trading)', bg: 'oklch(65% 0.18 255 / 0.12)' },
  creed: { label: 'Creed Consult', color: 'var(--clr-creed)', bg: 'oklch(65% 0.2 300 / 0.12)' },
  volatile: { label: 'Volatile', color: 'var(--clr-volatile)', bg: 'oklch(68% 0.2 30 / 0.12)' },
  networking: { label: 'Networking', color: 'var(--clr-networking)', bg: 'oklch(72% 0.16 160 / 0.12)' },
  avatar: { label: 'AI Avatar', color: 'var(--clr-avatar)', bg: 'oklch(70% 0.18 280 / 0.12)' },
  product: { label: 'Digital Product', color: 'var(--clr-product)', bg: 'oklch(70% 0.15 50 / 0.12)' },
  admin: { label: 'Admin', color: 'var(--clr-admin)', bg: 'oklch(60% 0.12 300 / 0.12)' },
  planning: { label: 'Planning', color: 'var(--clr-planning)', bg: 'oklch(60% 0.08 260 / 0.12)' },
  tradingbot: { label: 'Trading Bot', color: 'var(--clr-tradingbot)', bg: 'oklch(65% 0.18 255 / 0.12)' },
  meals: { label: 'Meals/Breaks', color: 'var(--clr-meals)', bg: 'oklch(55% 0.02 260 / 0.12)' },
  free: { label: 'Free Time', color: 'var(--clr-free)', bg: 'oklch(40% 0.01 260 / 0.12)' },
};

const VENTURE_ORDER = ['health','spiritual','trading','volatile','creed','tradingbot','avatar','product','networking','planning','admin'];
const NON_ACTIONABLE = ['meals','free'];
const DAY_FOCUS = {
  '2026-05-25': 'Foundation & Pipeline Setup',
  '2026-05-26': 'Build, Test, Rotate',
  '2026-05-27': 'Events: Design in the Age of AI + DMZ',
  '2026-05-28': 'Events: Future Ready with AI',
  '2026-05-29': 'AI Hackathon Day',
  '2026-05-30': 'Recovery & Creative Build',
  '2026-05-31': 'Review & Reset: Plan Next Week'
};

function catLabel(c) { return (CATEGORIES[c] || {}).label || c; }
function catColor(c) { return (CATEGORIES[c] || {}).color || 'var(--text-muted)'; }
function catBg(c) { return (CATEGORIES[c] || {}).bg || 'oklch(55% 0.02 260 / 0.12)'; }

/* ═══ RENDER ═══ */
function render() {
  renderStats();
  renderVentures();
  renderDayNav();
  renderColumns();
  renderCarryover();
  renderDod();
  updateClock();
}

/* ═══ STATS ═══ */
function renderStats() {
  const actionable = state.tasks.filter(t => !NON_ACTIONABLE.includes(t.category));
  const allTask = state.tasks;
  const done = allTask.filter(t => t.status === 'completed').length;
  const total = allTask.length;
  const doneA = actionable.filter(t => t.status === 'completed').length;
  const pct = total > 0 ? Math.round(doneA / actionable.length * 100) : 0;

  const today = getTodayStr();
  const todayTasks = allTask.filter(t => t.day === today);
  const todayDone = todayTasks.filter(t => t.status === 'completed').length;
  const todayTotal = todayTasks.filter(t => !NON_ACTIONABLE.includes(t.category)).length;
  const todayPct = todayTotal > 0 ? Math.round(todayDone / todayTotal * 100) : 0;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-ring">${ring(pct, 'var(--accent)')}</div>
      <div class="stat-info">Week<strong>${doneA}/${actionable.length}</strong></div>
    </div>
    <div class="stat-card">
      <div class="stat-ring">${ring(todayPct, 'var(--clr-health)')}</div>
      <div class="stat-info">Today<strong>${todayDone}/${todayTotal}</strong></div>
    </div>
    <div class="stat-card">
      <div class="streak"><span class="streak-icon">🔥</span>${state.streak}</div>
      <div class="stat-info">Day Streak</div>
    </div>
  `;
}

function ring(pct, color) {
  const r = 20; const circ = 2 * Math.PI * r;
  const off = circ - (pct / 100) * circ;
  return `<svg viewBox="0 0 48 48"><circle class="ring-track" cx="24" cy="24" r="${r}"/><circle class="ring-fill" cx="24" cy="24" r="${r}" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg><div class="ring-pct">${pct}%</div>`;
}

/* ═══ VENTURES ═══ */
function renderVentures() {
  const actionable = state.tasks.filter(t => !NON_ACTIONABLE.includes(t.category));
  let html = '';
  for (const v of VENTURE_ORDER) {
    const vtasks = actionable.filter(t => t.category === v);
    if (vtasks.length === 0) continue;
    const vdone = vtasks.filter(t => t.status === 'completed').length;
    const vpct = Math.round(vdone / vtasks.length * 100);
    const active = state.filterVenture === v ? ' active' : '';
    html += `
      <div class="vcard${active}" data-venture="${v}" onclick="filterByVenture('${v}')">
        <div class="vlabel">${catLabel(v)}</div>
        <div class="vbar"><div class="vfill" style="width:${vpct}%;background:${catColor(v)}"></div></div>
        <div class="vstat">${vdone}/${vtasks.length}</div>
      </div>`;
  }
  document.getElementById('ventureStrip').innerHTML = html;
}

/* ═══ DAY NAV ═══ */
function renderDayNav() {
  const days = getDays();
  const today = getTodayStr();
  let html = '';
  for (const d of days) {
    const dt = new Date(d+'T12:00:00');
    const name = dt.toLocaleDateString('en', {weekday:'short'}).toUpperCase();
    const dayNum = dt.getDate();
    const dtasks = state.tasks.filter(t => t.day === d);
    const ddone = dtasks.filter(t => t.status === 'completed').length;
    const dtotal = dtasks.filter(t => !NON_ACTIONABLE.includes(t.category)).length;
    const active = d === today ? ' active' : (state.selectedDay === d ? ' active' : '');
    html += `
      <button class="day-btn${active}" onclick="selectDay('${d}')">
        <span class="day-label">${name}</span>
        <span class="day-num">${dayNum}</span>
        <span class="day-progress">${ddone}/${dtotal}</span>
      </button>`;
  }
  document.getElementById('dayStrip').innerHTML = html;
}

/* ═══ 7-DAY COLUMNS ═══ */
function renderColumns() {
  const today = getTodayStr();
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  let html = '';

  const days = state.selectedDay ? [state.selectedDay] : getDays();
  const filtered = state.filterVenture
    ? state.tasks.filter(t => t.category === state.filterVenture)
    : state.tasks;

  for (const d of days) {
    const dt = new Date(d+'T12:00:00');
    const name = dt.toLocaleDateString('en', {weekday:'short'});
    const dtasks = filtered.filter(t => t.day === d).sort((a,b) => a.startTime.localeCompare(b.startTime));
    const dtoday = d === today ? ' today' : '';
    const focus = DAY_FOCUS[d] || '';

    let taskHtml = '';
    let nowInserted = false;

    for (let i = 0; i < dtasks.length; i++) {
      const t = dtasks[i];
      // NOW indicator logic: insert between tasks if current time falls between
      if (dtoday && !nowInserted) {
        const [tsh, tsm] = (t.startTime || '00:00').split(':').map(Number);
        const taskStart = tsh * 60 + tsm;
        const prevTask = i > 0 ? dtasks[i-1] : null;
        let prevEnd = 0;
        if (prevTask) {
          const [peh, pem] = (prevTask.endTime || '00:00').split(':').map(Number);
          prevEnd = peh * 60 + pem;
        }
        if (i === 0 && currentMinutes < taskStart) {
          taskHtml += nowBar();
          nowInserted = true;
        } else if (prevEnd && currentMinutes >= prevEnd && currentMinutes < taskStart) {
          taskHtml += nowBar();
          nowInserted = true;
        }
      }

      taskHtml += taskCard(t);
    }
    // NOW at end if after last task
    if (dtoday && !nowInserted && dtasks.length > 0) {
      const last = dtasks[dtasks.length - 1];
      const [leh, lem] = (last.endTime || '23:59').split(':').map(Number);
      if (currentMinutes >= leh * 60 + lem) taskHtml += nowBar();
    }

    html += `
      <div class="day-col${dtoday}">
        <div class="col-header">
          <span class="col-day">${name}</span>
          <span class="col-date">${dt.getDate()}</span>
        </div>
        ${focus ? `<div class="col-focus">${focus}</div>` : ''}
        <div class="col-tasks">${taskHtml || '<div style="padding:16px;color:var(--text-muted);font-size:11px;text-align:center">No tasks</div>'}</div>
      </div>`;
  }
  document.getElementById('columns').innerHTML = html;
}

function nowBar() {
  return `<div class="now-bar"><div class="now-dot"></div><div class="now-line"></div>NOW</div>`;
}

function taskCard(t) {
  const status = t.status || 'not_started';
  const dur = calcDuration(t.startTime, t.endTime);
  const durStr = dur >= 60 ? Math.floor(dur/60) + 'h' + (dur%60 ? ' ' + (dur%60) + 'm' : '') : dur + 'm';
  const btnDisabled = t._syncing ? 'disabled' : '';
  const cat = t.category || 'admin';
  const isCompleted = status === 'completed';
  const isSkipped = status === 'skipped';
  const isCarried = status === 'carried_over';
  const isStarted = status === 'started' || status === 'in_progress';

  // Elapsed timer
  const elapsed = (isStarted && t.startedAt) ? `<span class="elapsed" data-task="${t.id}">…</span>` : '';

  let actions = '';
  if (!isStarted && !isCompleted) {
    actions += `<button class="act-btn start" ${btnDisabled} onclick="doAction('${t.id}','start')">▶ Start</button>`;
  }
  if (!isCompleted) {
    actions += `<button class="act-btn complete" ${btnDisabled} onclick="doAction('${t.id}','complete')">✓ Done</button>`;
  }
  if (!isSkipped && !isCompleted && !isCarried) {
    actions += `<button class="act-btn skip" ${btnDisabled} onclick="doAction('${t.id}','skip')">⏭ Skip</button>`;
  }
  if (!isCarried && !isCompleted) {
    actions += `<button class="act-btn carry" ${btnDisabled} onclick="doAction('${t.id}','carry')">→ Carry</button>`;
  }
  if (isCompleted || isSkipped || isCarried) {
    actions += `<button class="act-btn reset" ${btnDisabled} onclick="doAction('${t.id}','reset')">↺ Reset</button>`;
  }
  actions += `<button class="act-btn notes" onclick="toggleNotes('${t.id}')">✎ Notes</button>`;

  return `
    <div class="task-card ${status}" id="task-${t.id}">
      <div class="task-time">${t.startTime} – ${t.endTime}<span class="task-dur">· ${durStr}</span></div>
      <div class="task-body">
        <span class="task-cat" style="background:${catBg(cat)};color:${catColor(cat)}">${catLabel(cat)}</span>
        <span class="task-title">${esc(t.title)}${elapsed}</span>
      </div>
      ${t.details ? `<div class="task-details">${esc(t.details)}</div>` : ''}
      ${NON_ACTIONABLE.includes(cat) ? '' : `<div class="task-actions">${actions}</div>`}
      ${t._showNotes ? `<div class="task-notes"><textarea id="notes-${t.id}" onblur="saveNotes('${t.id}')" placeholder="Add notes...">${esc(t.notes||'')}</textarea></div>` : ''}
    </div>`;
}

/* ═══ DOD ═══ */
function renderDod() {
  // Group tasks by category with their completion status
  const grouped = {};
  for (const t of state.tasks) {
    if (NON_ACTIONABLE.includes(t.category)) continue;
    const cat = t.category;
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(t);
  }

  let html = '';
  const totalDod = Object.values(grouped).flat().length;
  const checkedDod = Object.values(grouped).flat().filter(t => t.status === 'completed').length;

  html += `<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">${checkedDod}/${totalDod} completed</div>`;

  for (const [cat, tasks] of Object.entries(grouped)) {
    const done = tasks.filter(t => t.status === 'completed').length;
    html += `<div class="dod-group">
      <div class="dod-group-label">${catLabel(cat)} · ${done}/${tasks.length}</div>`;
    for (const t of tasks) {
      const checked = t.status === 'completed';
      html += `<div class="dod-item">
        <div class="dod-checkbox${checked ? ' checked' : ''}">${checked ? '✓' : ''}</div>
        <span style="${checked ? 'text-decoration:line-through;opacity:0.5' : ''}">${esc(t.title)}</span>
      </div>`;
    }
    html += `</div>`;
  }

  document.getElementById('dodBody').innerHTML = html;
}

/* ═══ ACTIONS ═══ */
function doAction(issueId, action) {
  const task = state.tasks.find(t => t.id === issueId);
  if (!task) return;

  task._prevStatus = task.status;

  if (action === 'start') {
    task.status = 'started';
    task.startedAt = new Date().toISOString();
    toast('▶ Started — timer running');
  } else if (action === 'complete') {
    task.status = 'completed';
    task.completedAt = new Date().toISOString();
    toast('✅ Completed!');
  } else if (action === 'skip') {
    task.status = 'skipped';
    toast('⏭ Skipped');
  } else if (action === 'carry') {
    task.status = 'carried_over';
    state.carryoverQueue.push({...task});
    toast('→ Moved to Carryover Queue');
  } else if (action === 'reset') {
    task.status = 'not_started';
    task.startedAt = null;
    task.completedAt = null;
    // Remove from carryover queue
    state.carryoverQueue = state.carryoverQueue.filter(t => t.id !== issueId);
    toast('↺ Reset to Not Started');
  }

  task._syncing = true;
  saveLocal();
  render();

  // Background sync to server
  fetch(`${API}/action`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({issue_id: issueId, action: action === 'carry' ? 'backlog' : action === 'reset' ? 'backlog' : action})
  }).then(r => r.json()).then(d => {
    if (d.success) {
      task._syncing = false;
      saveLocal();
    } else {
      rollback(task);
      toast('⚠ Sync failed, reverted');
    }
  }).catch(() => {
    rollback(task);
    toast('⚠ Server unreachable');
  });
}

function rollback(task) {
  task.status = task._prevStatus || 'not_started';
  if (task._prevStatus === 'carried_over') state.carryoverQueue = state.carryoverQueue.filter(t => t.id !== task.id);
  delete task._syncing;
  saveLocal();
  render();
}

/* ═══ VIEW ═══ */
function setView(view) {
  state.view = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'week') state.selectedDay = null;
  render();
}

function selectDay(day) {
  state.selectedDay = state.selectedDay === day ? null : day;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  render();
}

function filterByVenture(v) {
  state.filterVenture = state.filterVenture === v ? null : v;
  render();
}

/* ═══ DOD TOGGLE ═══ */
function toggleDod() {
  const panel = document.getElementById('dodPanel');
  const overlay = document.getElementById('dodOverlay');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  overlay.classList.toggle('show', !isOpen);
}

/* ═══ CARRYOVER QUEUE RENDER ═══ */
function renderCarryover() {
  const section = document.getElementById('carrySection');
  const list = document.getElementById('carryList');
  if (state.carryoverQueue.length === 0) {
    section.classList.remove('visible');
    return;
  }
  section.classList.add('visible');
  const days = getDays();
  let html = '';
  for (const ct of state.carryoverQueue) {
    const dayOptions = days.map(d => {
      const dd = new Date(d+'T12:00:00');
      return `<option value="${d}">${dd.toLocaleDateString('en',{weekday:'short'})} ${dd.getDate()}</option>`;
    }).join('');
    html += `
      <div class="carry-item">
        <span class="carry-cat" style="background:${catBg(ct.category)};color:${catColor(ct.category)}">${catLabel(ct.category)}</span>
        <span class="carry-title">${esc(ct.title)}</span>
        <select class="carry-assign" onchange="assignCarryover('${ct.id}', this.value)">
          <option value="">Assign to…</option>
          ${dayOptions}
        </select>
        <button class="carry-remove" onclick="removeCarryover('${ct.id}')">×</button>
      </div>`;
  }
  list.innerHTML = html;
}

function assignCarryover(taskId, targetDay) {
  if (!targetDay) return;
  const task = state.tasks.find(t => t.id === taskId);
  if (task) {
    task.day = targetDay;
    task.status = 'not_started';
    task.startedAt = null;
    task.completedAt = null;
  }
  state.carryoverQueue = state.carryoverQueue.filter(t => t.id !== taskId);
  saveLocal();
  render();
  toast('Assigned to ' + targetDay);
}

function removeCarryover(taskId) {
  state.carryoverQueue = state.carryoverQueue.filter(t => t.id !== taskId);
  const task = state.tasks.find(t => t.id === taskId);
  if (task) {
    task.status = 'not_started';
    task.startedAt = null;
    task.completedAt = null;
  }
  saveLocal();
  render();
  toast('Removed from carryover');
}

/* ═══ NOTES ═══ */
function toggleNotes(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  task._showNotes = !task._showNotes;
  render();
  if (task._showNotes) {
    setTimeout(() => {
      const ta = document.getElementById('notes-'+taskId);
      if (ta) { ta.focus(); ta.selectionStart = ta.value.length; }
    }, 50);
  }
}

function saveNotes(taskId) {
  const ta = document.getElementById('notes-'+taskId);
  if (!ta) return;
  const task = state.tasks.find(t => t.id === taskId);
  if (task && ta.value !== (task.notes || '')) {
    task.notes = ta.value;
    saveLocal();
  }
}

/* ═══ ELAPSED TIMER ═══ */
function updateTimers() {
  const now = Date.now();
  document.querySelectorAll('.elapsed').forEach(el => {
    const taskId = el.dataset.task;
    const task = state.tasks.find(t => t.id === taskId);
    if (task && task.startedAt) {
      const diff = Math.floor((now - new Date(task.startedAt).getTime()) / 1000);
      const m = Math.floor(diff / 60);
      const s = diff % 60;
      el.textContent = m + ':' + String(s).padStart(2, '0');
    }
  });
}

/* ═══ HELPERS ═══ */
function getTodayStr() { return new Date().toISOString().slice(0,10); }
function getDays() {
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - today.getDay() + 1);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function calcDuration(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  return (eh * 60 + em) - (sh * 60 + sm);
}
function esc(s) { const d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function toast(msg) {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ═══ CLOCK ═══ */
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',hour12:true});
  const days = getDays();
  const monday = new Date(days[0]+'T12:00:00');
  const sunday = new Date(days[6]+'T12:00:00');
  document.getElementById('weekLabel').textContent = `Week of ${monday.toLocaleDateString('en',{month:'short',day:'numeric'})} – ${sunday.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}`;
}

/* ═══ LOCAL STORAGE ═══ */
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      tasks: state.tasks.map(t => ({
        id: t.id, status: t.status, startedAt: t.startedAt,
        completedAt: t.completedAt, notes: t.notes
      })),
      carryoverQueue: state.carryoverQueue.map(t => t.id),
      dodState: state.dodState, streak: state.streak
    }));
  } catch(e) {}
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.tasks) {
      const localMap = {};
      for (const t of d.tasks) localMap[t.id] = t;
      for (const t of state.tasks) {
        if (localMap[t.id]) {
          t.status = localMap[t.id].status || t.status;
          t.startedAt = localMap[t.id].startedAt || null;
          t.completedAt = localMap[t.id].completedAt || null;
          t.notes = localMap[t.id].notes || '';
        }
      }
    }
    if (d && d.carryoverQueue) {
      state.carryoverQueue = state.tasks.filter(t => d.carryoverQueue.includes(t.id) && t.status === 'carried_over');
    }
    if (d && d.streak) state.streak = d.streak;
    if (d && d.dodState) state.dodState = d.dodState;
  } catch(e) {}
}

/* ═══ DATA LOADING ═══ */
async function loadData() {
  try {
    const r = await fetch(`${API}/state`);
    const d = await r.json();
    state.tasks = d.issues || [];
    state.calendar = d.calendar || [];
    state.streak = d.streak || 0;
    loadLocal();
    render();
  } catch(e) {
    console.error('Load failed:', e);
    loadLocal();
    render();
  }
}

/* ═══ INIT ═══ */
loadData();
setInterval(loadData, 30000);     // Poll every 30s
setInterval(updateClock, 30000);   // Update clock
setInterval(render, 60000);       // Full re-render every 60s for NOW indicator
setInterval(updateTimers, 1000);   // Update elapsed timers every second
</script>
</body>
</html>
